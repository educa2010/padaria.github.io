<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padaria Delícia</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>🥖 Padaria Delícia</h2>
  <nav>
    <a onclick="show('home')">Home</a>
    <a onclick="show('produtos')">Produtos</a>
    <a onclick="show('checkout')">Checkout</a>
    <a onclick="show('admin')">Admin</a>
  </nav>
</header>

<section id="home" class="ativa">
  <h1>Pães artesanais todos os dias</h1>
  <button onclick="show('produtos')">Fazer Pedido</button>
</section>

<section id="produtos">
  <h2>Produtos</h2>
  <div id="lista"></div>
</section>

<section id="checkout">
  <h2>Dados do Cliente</h2>

  <input id="nome" placeholder="Nome">
  <input id="telefone" placeholder="Telefone">
  <input id="endereco" placeholder="Endereço">
  <textarea id="obs" placeholder="Observações"></textarea>

  <h3>Pagamento</h3>
  <select id="pagamento">
    <option value="PIX">PIX</option>
  </select>

  <p><b>Chave PIX:</b> 16993699410</p>
  <button onclick="copiarPix()">Copiar PIX</button>

  <button onclick="finalizar()">Finalizar Pedido</button>
</section>

<section id="admin">
  <h2>Painel Administrativo</h2>

  <div id="login">
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
  </div>

  <div id="painel">
    <h3>Pedidos Recebidos</h3>
    <div id="pedidos"></div>
  </div>
</section>

<footer>
  © 2026 - Padaria Delícia
</footer>

<script src="script.js"></script>
</body>
</html>
